name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lich-am/mobile run lint
      - run: pnpm --filter @lich-am/mobile run test
      - run: pnpm --filter @lich-am/desktop run lint
      - run: pnpm --filter @lich-am/desktop run build:web
      - run: pnpm --filter @lich-am/ui run lint
      - run: pnpm --filter @lich-am/ui run test
